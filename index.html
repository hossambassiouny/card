<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسام بسيوني | Hossam Bassiouny</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; max-width: 450px; width: 100%; padding: 30px 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #38bdf8; margin-bottom: 15px; }
        h1 { font-size: 1.4rem; margin-bottom: 6px; color: #ffffff; }
        p.bio { font-size: 0.9rem; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        .links { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .btn { display: flex; align-items: center; justify-content: center; background-color: #334155; color: #ffffff; text-decoration: none; padding: 14px 20px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; transition: all 0.2s ease; border: 1px solid #475569; }
        .btn:hover { background-color: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .btn-cv { background-color: #0284c7; border-color: #0284c7; }
        .btn-cv:hover { background-color: #0369a1; color: white; }
        .section-title { font-size: 0.95rem; color: #cbd5e1; margin: 20px 0 10px; text-align: right; border-right: 3px solid #38bdf8; padding-right: 8px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; margin-top: 10px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- الصورة الشخصية: استبدل رابط الصورة برابط صورتك أو ضع اسم ملف صورتك المرفوع على جيت هب -->
        <img src="https://via.placeholder.com/150" alt="حسام بسيوني" class="avatar">
        
        <!-- الاسم والنبذة الشخصية -->
        <h1>حسام بسيوني</h1>
        <p class="bio">صانع محتوى ومتخصص في الأعمال المرئية | أساعد الشركات والأفراد على تنمية حضورهم الرقمي.</p>
        
        <!-- الأزرار والروابط -->
        <div class="links">
            <!-- رابط الـ CV: احرص على رفع ملف الـ PDF باسم cv.pdf في جيت هب -->
            <a href="cv.pdf" class="btn btn-cv" target="_blank">📄 تحميل السيرة الذاتية (CV)</a>
            
            <a href="https://linkedin.com/in/your-profile" class="btn" target="_blank">💼 حساب لينكد إن (LinkedIn)</a>
            <a href="https://wa.me/201000000000" class="btn" target="_blank">💬 تواصل عبر واتساب</a>
            <a href="https://facebook.com/your-profile" class="btn" target="_blank">🌐 فيسبوك / Facebook</a>
        </div>

        <!-- معرض الفيديوهات والأعمال -->
        <div class="section-title">فيديو عن أعمالي</div>
        <div class="video-container">
            <!-- استبدل رابط Embed اليوتيوب برابط الفيديو الخاص بك -->
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
